# Triển khai trên một máy chủ (VPS, Oracle Cloud Always Free...): Caddy (HTTPS tự động) → api, staff,
# guest; PostgreSQL, Redis, sao lưu hằng ngày. Chạy liên tục, không ngủ.
#
# Cài tự động: infra/vps/install.sh. Chạy tay:
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
name: dalan
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN_API: ${DOMAIN_API}
      DOMAIN_STAFF: ${DOMAIN_STAFF}
      DOMAIN_GUEST: ${DOMAIN_GUEST}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    depends_on: [api, staff, guest]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dalan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dalan}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GUEST_TOKEN_SECRET: ${GUEST_TOKEN_SECRET}
      API_PUBLIC_URL: https://${DOMAIN_API}
      STAFF_APP_URL: https://${DOMAIN_STAFF}
      GUEST_APP_URL: https://${DOMAIN_GUEST}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD}
      SEED_STAFF_PIN: ${SEED_STAFF_PIN}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-vietqr,mock}
      EINVOICE_PROVIDER: ${EINVOICE_PROVIDER:-mock}
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/repo/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  staff:
    build:
      context: ..
      dockerfile: infra/Dockerfile.next
      args:
        APP: staff
        NEXT_PUBLIC_API_URL: https://${DOMAIN_API}
        NEXT_PUBLIC_GUEST_URL: https://${DOMAIN_GUEST}
        NEXT_PUBLIC_DEMO: ${NEXT_PUBLIC_DEMO:-0}
    restart: unless-stopped

  guest:
    build:
      context: ..
      dockerfile: infra/Dockerfile.next
      args:
        APP: guest
        NEXT_PUBLIC_API_URL: https://${DOMAIN_API}
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dalan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dalan}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dalan} -d ${POSTGRES_DB:-dalan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-dalan}
      POSTGRES_DB: ${POSTGRES_DB:-dalan}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
  backups:
  caddy-data:
  caddy-config:
