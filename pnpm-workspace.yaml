  pino: ^10.4.0
  nestjs-pino: ^5.3.1
  pino-pretty: ^13.2.0
  argon2: ^0.45.1
  jose: ^6.2.0
  uuid: ^14.0.3
  nanoid: ^6.0.2
  libphonenumber-js: ^1.13.15
  qrcode: ^1.5.4
