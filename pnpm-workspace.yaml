packages:
  - apps/*
  - packages/*

# node_modules phang kieu npm: tranh junction/symlink trong thu muc OneDrive tren Windows
nodeLinker: hoisted

# Chi dung phien ban da phat hanh it nhat 1 ngay (don vi phut) de giam rui ro chuoi cung ung
minimumReleaseAge: 1440

# Chi cac goi duoi day duoc chay script cai dat (pnpm 11+)
allowBuilds:
  argon2: true
  esbuild: true
  sharp: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  "@swc/core": true
  "@nestjs/core": true
  "@napi-rs/canvas": true
  msgpackr-extract: true
  "@parcel/watcher": true
  "@scarf/scarf": false
  puppeteer: false
  core-js: false
  protobufjs: false

catalog:
  typescript: ^5.9.3
  "@types/node": ^24.0.0
  tsx: ^4.23.15
  turbo: ^2.11.9
  prettier: ^3.9.10
  eslint: ^10.13.0
  typescript-eslint: ^8.70.0
  eslint-config-prettier: ^10.1.8
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  "@playwright/test": ^1.64.1
  dotenv: ^18.0.8
  zod: ^4.6.7
  prisma: ^7.10.1
  "@prisma/client": ^7.10.1
  "@prisma/adapter-pg": ^7.10.1
  pg: ^8.23.1
  "@types/pg": ^8.23.1
  ioredis: ^6.0.0
  bullmq: ^6.3.0
  "@nestjs/core": ^12.2.0
  "@nestjs/common": ^12.2.0
  "@nestjs/platform-fastify": ^12.2.0
  "@nestjs/websockets": ^12.2.0
  "@nestjs/platform-socket.io": ^12.2.0
  "@nestjs/swagger": ^12.0.2
  "@nestjs/config": ^12.0.1
  "@nestjs/schedule": ^12.0.2
  "@nestjs/bullmq": ^12.0.0
  "@nestjs/jwt": ^12.0.3
  "@nestjs/throttler": ^6.7.1
  "@nestjs/testing": ^12.2.0
  "@nestjs/cli": ^12.0.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  fastify: ^5.12.7
  "@fastify/helmet": ^13.2.0
  "@fastify/cors": ^11.3.1
  "@fastify/cookie": ^11.1.3
  "@fastify/multipart": ^10.1.4
  "@fastify/static": ^10.1.6
  socket.io: ^4.8.4
  socket.io-client: ^4.8.4
